name: Build APK
run-name: "🔨 Сборка APK DroSteamLoader"

on:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать архив проекта в корень
        run: |
          set -e
          ARCH=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ARCH" ]; then
            echo "::error::Не найден архив проекта (*.zip) в корне репозитория"; exit 1
          fi
          echo "Распаковываю $ARCH"
          unzip -o -q "$ARCH" -d _extracted
          INNER=$(find _extracted -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -n "$INNER" ] && [ -f "$INNER/package.json" ]; then SRC="$INNER"; else SRC=_extracted; fi
          shopt -s dotglob
          for item in "$SRC"/*; do
            name=$(basename "$item")
            [ "$name" = ".github" ] && continue
            rm -rf "./$name"
            cp -r "$item" "./$name"
          done
          shopt -u dotglob
          rm -rf _extracted
          rm -f "$ARCH"
          if [ ! -f package.json ]; then echo "::error::В архиве нет package.json — не тот архив?"; exit 1; fi
          echo "=== корень после распаковки ===" && ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: |
          set -e
          rm -rf android
          rm -f capacitor.config.ts
          npx cap add android
          npx cap copy android
          {
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
            echo "org.gradle.configureondemand=true"
            echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"
            echo "android.useAndroidX=true"
            echo "kotlin.code.style=official"
          } >> android/gradle.properties
          # версия приложения из package.json: versionName = X.YYY, versionCode = XYYY
          VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.001")
          VCODE=$(echo "$VER" | tr -d '.')
          GRV=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $VCODE/" "$GRV"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VER\"/" "$GRV"
          grep -nE "versionCode|versionName" "$GRV" || true
          # минимальная версия Android 8 — нужна для java.nio.file и CompletableFuture
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 26/" android/variables.gradle || true

      - name: Подключить Kotlin и библиотеки Steam
        run: |
          set -e
          KOTLIN_VER=2.2.21
          ROOT=android/build.gradle
          GR=android/app/build.gradle

          # 1) плагины Kotlin в корневой buildscript
          if ! grep -q "kotlin-gradle-plugin" "$ROOT"; then
            sed -i "0,/classpath /s##classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:$KOTLIN_VER\"\n        classpath \"org.jetbrains.kotlin:kotlin-serialization:$KOTLIN_VER\"\n        classpath #" "$ROOT"
          fi
          grep -n "kotlin" "$ROOT" || true

          # 2) применяем плагины в модуле приложения
          if ! grep -q "kotlin-android" "$GR"; then
            sed -i "0,/apply plugin: 'com.android.application'/s##apply plugin: 'com.android.application'\napply plugin: 'org.jetbrains.kotlin.android'\napply plugin: 'org.jetbrains.kotlin.plugin.serialization'#" "$GR"
          fi

          # 3) java 17 + kotlin 17 + исключения дублей из jar-ов
          if ! grep -q "jvmTarget" "$GR"; then
            sed -i "0,/^android {/{s##android {\n    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n    kotlinOptions { jvmTarget = '17' }\n    packaging { resources { excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'] } }\n    lint { checkReleaseBuilds false; abortOnError false }#}" "$GR"
          fi

          # 4) библиотеки: JavaSteam + всё, что нужно загрузчику депотов
          if ! grep -q "javasteam" "$GR"; then
            sed -i "0,/dependencies {/s##dependencies {\n    implementation 'in.dragonbra:javasteam:1.8.0'\n    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'\n    implementation 'com.google.protobuf:protobuf-java:4.31.1'\n    implementation 'org.tukaani:xz:1.11'\n    implementation 'com.github.luben:zstd-jni:1.5.7-6@aar'\n    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'\n    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'\n    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'\n    implementation 'io.ktor:ktor-client-core:3.3.3'\n    implementation 'io.ktor:ktor-client-cio:3.3.3'\n    implementation 'com.squareup.okio:okio:3.16.0'\n    implementation 'org.apache.commons:commons-lang3:3.20.0'\n    implementation 'com.squareup.okhttp3:okhttp:5.3.2'#" "$GR"
          fi
          grep -n "javasteam\|ktor\|zstd" "$GR" || true

      - name: Generate app icons
        run: |
          if [ -f resources/icon.svg ]; then
            npm i -g sharp-cli >/dev/null 2>&1 || npm i sharp >/dev/null 2>&1 || true
            node -e "const s=require('sharp');s('resources/icon.svg',{density:300}).resize(1024,1024).png().toFile('resources/icon.png').then(()=>console.log('svg->png ok')).catch(e=>{console.log('render skip:',e.message)})" || echo "sharp render skipped"
          fi
          npx @capacitor/assets generate --android --assetPath resources

      - name: Разрешения и служба загрузки в манифесте
        run: |
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          if ! grep -q "FOREGROUND_SERVICE" "$MAN"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n\n    <application#' "$MAN"
          fi
          sed -i 's#<application #<application android:largeHeap="true" android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true" #' "$MAN"
          sed -i 's#<application #<application android:enableOnBackInvokedCallback="false" #' "$MAN"
          if ! grep -q "DownloadService" "$MAN"; then
            sed -i 's#</application>#    <service android:name="leshugan.DSL.DownloadService" android:exported="false" android:foregroundServiceType="dataSync" />\n    </application>#' "$MAN"
          fi
          echo "----- manifest -----"
          grep -E "uses-permission|DownloadService|usesCleartext" "$MAN" || true

      - name: Положить наш нативный код
        run: |
          set -e
          PKG=android/app/src/main/java/leshugan/DSL
          mkdir -p "$PKG" android/app/src/main/kotlin
          for f in native/*.java; do
            cp "$f" "$PKG/$(basename "$f")"
          done
          # загрузчик депотов (исходники JavaSteam, лицензия MIT — файл LICENSE_JavaSteam.txt)
          cp -r native/kotlin/in android/app/src/main/kotlin/
          mkdir -p android/app/src/main/assets
          cp native/kotlin/LICENSE_JavaSteam.txt android/app/src/main/assets/LICENSE_JavaSteam.txt
          echo "java:" && ls -la "$PKG"
          echo "kotlin:" && find android/app/src/main/kotlin -name "*.kt" | wc -l

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Разрешить серверы Steam по открытому протоколу
        run: |
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          NSC=android/app/src/main/res/xml/network_security_config.xml
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<network-security-config>' \
            '    <base-config cleartextTrafficPermitted="true">' \
            '        <trust-anchors>' \
            '            <certificates src="system" />' \
            '        </trust-anchors>' \
            '    </base-config>' \
            '</network-security-config>' > "$NSC"
          if ! grep -q "networkSecurityConfig" "$MAN"; then
            sed -i 's#<application #<application android:networkSecurityConfig="@xml/network_security_config" #' "$MAN"
          fi
          echo "----- network_security_config.xml -----"
          cat "$NSC"
          grep -E "networkSecurityConfig|usesCleartextTraffic" "$MAN" || true

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/uc.jks" \
            -Pandroid.injected.signing.store.password="updatechecker" \
            -Pandroid.injected.signing.key.alias="uc" \
            -Pandroid.injected.signing.key.password="updatechecker"

      - name: Переименовать APK по версии
        run: |
          set -e
          VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "dev")
          DIR=android/app/build/outputs/apk/release
          SRC=$(ls "$DIR"/*.apk | head -1)
          mv "$SRC" "$DIR/DroSteamLoader $VER.apk"
          ls -la "$DIR"

      - name: Upload APK (артефакт)
        id: upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DroSteamLoader_Compiled
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 5

      - name: Выложить APK в релиз (если квота артефактов исчерпана)
        if: steps.upload_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          TAG=apk-latest
          NOTES="Автосборка #${{ github.run_number }} от $(date -u +'%Y-%m-%d %H:%M UTC') — выложено в релиз, т.к. квота артефактов исчерпана."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$REPO" --title "DroSteamLoader_Compiled" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$APK" --repo "$REPO" --clobber
          echo "::notice::Квота артефактов исчерпана — APK в релизе $TAG"

  cleanup:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Чистка старых запусков (10 успешных + 1 последний неуспешный)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          WF=build.yml

          echo "Оставляем 10 последних успешных запусков:"
          KEEP_OK=$(gh run list --repo "$REPO" --workflow "$WF" --status success --limit 10 --json databaseId --jq '.[].databaseId')
          echo "$KEEP_OK"

          echo "Оставляем последний неуспешный запуск:"
          KEEP_BAD=$(gh run list --repo "$REPO" --workflow "$WF" --limit 100 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion != null and .conclusion != "success")] | .[0].databaseId // empty')
          echo "${KEEP_BAD:-нет}"

          KEEP=$(printf '%s\n%s\n' "$KEEP_OK" "$KEEP_BAD" | grep -v '^$' || true)

          echo "Удаляем остальные запуски и их APK:"
          gh run list --repo "$REPO" --workflow "$WF" --limit 300 --json databaseId --jq '.[].databaseId' | while read -r id; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if ! printf '%s\n' "$KEEP" | grep -qx "$id"; then
              gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 && echo "удалён $id" || true
            fi
          done
